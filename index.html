<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuenta Atrás - DOOMSDAY</title>

<!-- Fuentes épicas e imponentes -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-dark: #030507;
        --doom-green: #047857;
        --doom-glow: #10b981;
        --doom-emerald: #059669;
        --metal-light: #f1f5f9;
        --metal-mid: #94a3b8;
        --metal-dark: #334155;
        --card-bg: rgba(10, 18, 15, 0.75);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: var(--bg-dark);
        background-image: 
            radial-gradient(circle at 50% 110%, rgba(4, 120, 87, 0.45) 0%, transparent 65%),
            radial-gradient(circle at 15% 15%, rgba(15, 23, 42, 0.8) 0%, transparent 50%),
            radial-gradient(circle at 85% 85%, rgba(6, 78, 59, 0.25) 0%, transparent 50%);
        color: #fff;
        overflow-x: hidden;
        position: relative;
        font-family: 'Montserrat', sans-serif;
    }

    /* Partículas y cenizas flotantes estilo Doom */
    .magic-sparks {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: 
            radial-gradient(var(--doom-glow) 1.5px, transparent 1.5px),
            radial-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
            radial-gradient(var(--doom-green) 2.5px, transparent 2.5px);
        background-size: 70px 70px, 110px 110px, 160px 160px;
        background-position: 0 0, 40px 40px, 20px 80px;
        opacity: 0.2;
        animation: rise 25s linear infinite;
        z-index: 1;
        pointer-events: none;
    }

    @keyframes rise {
        0% { transform: translateY(0) scale(1); opacity: 0.15; }
        50% { opacity: 0.35; }
        100% { transform: translateY(-600px) scale(1.25); opacity: 0.15; }
    }

    /* Energía sutil de fondo */
    .energy-ring {
        position: absolute;
        width: 800px;
        height: 800px;
        border-radius: 50%;
        border: 1px dashed rgba(16, 185, 129, 0.12);
        animation: spin-slow 60s linear infinite;
        z-index: 1;
        pointer-events: none;
    }

    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    .container {
        position: relative;
        z-index: 10;
        text-align: center;
        padding: 2.5rem 1.5rem;
        width: 100%;
        max-width: 1300px;
        animation: villain-fade-in 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .badge-doom {
        display: inline-block;
        padding: 0.4rem 1.2rem;
        background: rgba(4, 120, 87, 0.15);
        border: 1px solid var(--doom-glow);
        color: var(--doom-glow);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 4px;
        text-transform: uppercase;
        border-radius: 20px;
        margin-bottom: 1.5rem;
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
        animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.5); }
        50% { box-shadow: 0 0 30px rgba(16, 185, 129, 0.5); border-color: var(--doom-glow); }
    }

    h1 {
        font-family: 'Bebas Neue', sans-serif;
        font-size: clamp(3rem, 7.5vw, 6rem);
        letter-spacing: clamp(4px, 1.5vw, 10px);
        margin-bottom: 0.4rem;
        background: linear-gradient(to bottom, var(--metal-light) 0%, var(--metal-mid) 55%, var(--metal-dark) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        line-height: 1.05;
    }

    .subtitle {
        font-size: clamp(0.75rem, 2vw, 1.1rem);
        font-weight: 700;
        letter-spacing: clamp(3px, 1.2vw, 7px);
        text-transform: uppercase;
        color: var(--doom-glow);
        margin-bottom: clamp(2.5rem, 5vw, 4rem);
        text-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
    }

    .countdown {
        display: flex;
        gap: clamp(0.6rem, 1.5vw, 1.2rem);
        justify-content: center;
        flex-wrap: wrap;
    }

    .box {
        width: clamp(72px, 16vw, 125px);
        height: clamp(88px, 20vw, 145px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: var(--card-bg);
        border: 2px solid rgba(71, 85, 105, 0.6);
        border-top: 3px solid var(--doom-glow);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.85), 
                    inset 0 0 25px rgba(4, 120, 87, 0.25);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease, border-color 0.4s;
        border-radius: 10px;
        position: relative;
        overflow: hidden;
    }

    .box::after {
        content: '';
        position: absolute;
        top: 0; left: -100%; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
        transition: 0.5s;
    }

    .box:hover::after {
        left: 100%;
    }

    .box:hover {
        transform: scale(1.06) translateY(-6px);
        border-color: var(--doom-glow);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.95), 
                    inset 0 0 35px rgba(16, 185, 129, 0.5),
                    0 0 25px rgba(16, 185, 129, 0.35);
    }

    .number {
        font-family: 'Bebas Neue', sans-serif;
        font-size: clamp(2.3rem, 6.5vw, 5rem);
        line-height: 1;
        color: #fff;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        margin-bottom: 0.2rem;
        font-variant-numeric: tabular-nums; 
    }

    .label {
        font-size: clamp(0.5rem, 1.3vw, 0.75rem);
        font-weight: 700;
        letter-spacing: clamp(1px, 0.5vw, 2.5px);
        text-transform: uppercase;
        color: var(--metal-mid);
    }

    .finished {
        font-family: 'Bebas Neue', sans-serif;
        font-size: clamp(2.8rem, 9vw, 6rem);
        letter-spacing: 4px;
        background: linear-gradient(to bottom, #34d399 0%, #047857 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: villain-reveal 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        text-shadow: 0 0 60px rgba(16, 185, 129, 0.7);
        line-height: 1.1;
        padding: 0 10px;
    }

    @keyframes villain-fade-in {
        from { opacity: 0; transform: scale(1.04); filter: blur(12px); }
        to { opacity: 1; transform: scale(1); filter: blur(0); }
    }

    @keyframes villain-reveal {
        from { opacity: 0; transform: scale(0.8) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .magic-pulse {
        animation: doom-impact 0.4s ease-out;
    }

    @keyframes doom-impact {
        0% { transform: scale(1.12); color: var(--doom-glow); text-shadow: 0 0 30px var(--doom-glow); }
        100% { transform: scale(1); color: #fff; text-shadow: 0 0 20px rgba(255, 255, 255, 0.5); }
    }

    /* Pie de página con fecha exacta */
    .event-footer {
        margin-top: 3.5rem;
        font-size: 0.85rem;
        letter-spacing: 2px;
        color: var(--metal-mid);
        text-transform: uppercase;
        font-weight: 500;
    }

    .event-footer span {
        color: var(--metal-light);
        font-weight: 700;
    }
</style>
</head>
<body>

<div class="magic-sparks"></div>
<div class="energy-ring"></div>

<div class="container">
    <div class="badge-doom">Marvel Cinematic Universe</div>
    <h1>VENGADORES: DOOMSDAY</h1>
    <div class="subtitle">No hay esperanza. Solo existe Doom.</div>

    <div class="countdown" id="countdown-grid">
        <div class="box">
            <div id="months" class="number">00</div>
            <div class="label">Meses</div>
        </div>
        <div class="box">
            <div id="days" class="number">00</div>
            <div class="label">Días</div>
        </div>
        <div class="box">
            <div id="hours" class="number">00</div>
            <div class="label">Horas</div>
        </div>
        <div class="box">
            <div id="minutes" class="number">00</div>
            <div class="label">Minutos</div>
        </div>
        <div class="box">
            <div id="seconds" class="number">00</div>
            <div class="label">Segundos</div>
        </div>
    </div>

    <div class="event-footer">
        Fecha de condena: <span>17 de Diciembre de 2026 • 19:00h</span>
    </div>
</div>

<script>
    // Fecha objetivo: 17 de diciembre de 2026 a las 19:00
    const targetDate = new Date("2026-12-17T19:00:00");

    function updateCountdown() {
        const now = new Date();
        const diff = targetDate - now;

        if (diff <= 0) {
            document.querySelector(".container").innerHTML = `
                <div class="finished">
                    ¡ARRODILLAOS ANTE DOOM! 🎭
                </div>
            `;
            return;
        }

        // Cálculo preciso incluyendo meses calendario
        let years = targetDate.getFullYear() - now.getFullYear();
        let months = targetDate.getMonth() - now.getMonth() + (years * 12);
        let days = targetDate.getDate() - now.getDate();

        // Si los días son negativos, ajustamos restando un mes y sumando los días del mes anterior
        if (days < 0) {
            months--;
            const prevMonth = new Date(targetDate.getFullYear(), targetDate.getMonth() - 1, now.getDate());
            // Días en el mes anterior
            const daysInPrevMonth = new Date(targetDate.getFullYear(), targetDate.getMonth(), 0).getDate();
            // Aproximación exacta de días restantes
            const tempDate = new Date(now);
            tempDate.setMonth(tempDate.getMonth() + months);
            let diffDaysTime = targetDate - tempDate;
            days = Math.floor(diffDaysTime / (1000 * 60 * 60 * 24));
        }

        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        const values = { months, days, hours, minutes, seconds };

        for (const id in values) {
            const el = document.getElementById(id);
            if (!el) continue;
            
            const value = String(values[id]).padStart(2, "0");

            if (el.textContent !== value) {
                el.textContent = value;
                
                el.classList.remove("magic-pulse");
                void el.offsetWidth;
                el.classList.add("magic-pulse");
            }
        }
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>

</body>
</html>
